services:
  - type: web
    name: speakrightai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: MAX_UPLOAD_SIZE_MB
        value: 25
      - key: CORS_ORIGINS
        sync: false
