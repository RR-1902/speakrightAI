services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: speakrightai-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:8000
    container_name: speakrightai-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
